<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estado de pedido · Cerveza Locundus</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@400;500;600&display=swap');

:root {
  --bg: #0e0e0e;
  --card: #1f1f1f;
  --copper: #FF6200;
  --copper-light: #FF8533;
  --ink: #E8E8E8;
  --muted: #8a8a8a;
  --green: #3ecf4a;
  --red: #E6392B;
  --line: #333;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: linear-gradient(160deg, #1a1a1a, #0e0e0e);
  font-family: 'Rajdhani', sans-serif;
  color: var(--ink);
  padding: 24px 16px 40px;
}

.wrap {
  max-width: 480px;
  margin: 0 auto;
}

header {
  text-align: center;
  margin-bottom: 28px;
}

header h1 {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 1.5em;
  color: var(--copper);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

header p {
  color: var(--muted);
  font-size: 0.9em;
  letter-spacing: 1px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 18px 20px;
  margin-bottom: 14px;
}

.card h2 {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 1.05em;
  color: var(--ink);
  margin-bottom: 12px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.cliente-name {
  font-size: 1.15em;
  font-weight: 600;
  color: var(--copper-light);
  margin-bottom: 6px;
}

.muted { color: var(--muted); font-size: 0.88em; }

.pedido {
  border-bottom: 1px dashed var(--line);
  padding: 12px 0;
}

.pedido:last-child { border-bottom: none; }

.pedido-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 4px;
}

.sabor {
  font-weight: 600;
  font-size: 1.05em;
}

.fecha {
  font-size: 0.85em;
  color: var(--muted);
}

.detalle {
  font-size: 0.9em;
  color: var(--muted);
  margin-top: 2px;
}

.estado {
  display: inline-block;
  font-family: 'Chakra Petch', sans-serif;
  font-size: 0.72em;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 3px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  white-space: nowrap;
}

.estado.pagado {
  background: #1a3320;
  color: var(--green);
}

.estado.pendiente {
  background: #3a1a18;
  color: var(--red);
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 30px 10px;
  font-size: 0.95em;
}

.loading {
  text-align: center;
  color: var(--copper-light);
  padding: 40px 10px;
  font-size: 0.95em;
}

.footer {
  text-align: center;
  margin-top: 24px;
  font-size: 0.8em;
  color: #555;
}

.resumen {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
}

.stat {
  flex: 1;
  background: #252525;
  border-radius: 6px;
  padding: 12px;
  text-align: center;
  border: 1px solid var(--line);
}

.stat .num {
  display: block;
  font-family: 'Chakra Petch', sans-serif;
  font-size: 1.4em;
  color: var(--copper);
  font-weight: 600;
}

.stat .lbl {
  font-size: 0.75em;
  color: var(--muted);
  margin-top: 2px;
}

.btn-pdf {
  margin-top: 8px;
  font-family: 'Chakra Petch', sans-serif;
  font-size: 0.72em;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 7px 12px;
  border-radius: 4px;
  border: 1px solid var(--copper);
  background: transparent;
  color: var(--copper-light);
  cursor: pointer;
}

.btn-pdf:hover {
  background: var(--copper);
  color: #111;
}

.btn-pdf:disabled {
  opacity: 0.5;
  cursor: default;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🍺 Cerveza Locundus</h1>
    <p>Estado de tu pedido</p>
  </header>

  <div id="content">
    <div class="loading">Cargando información…</div>
  </div>

  <div class="footer">
    Cerveza Locundus · nano brewery
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA949Wrf0ErPiWYhGUx5Pk25M21dQZ7Dgs",
  authDomain: "cervecera-tierra-grande.firebaseapp.com",
  databaseURL: "https://cervecera-tierra-grande-default-rtdb.firebaseio.com",
  projectId: "cervecera-tierra-grande",
  storageBucket: "cervecera-tierra-grande.firebasestorage.app",
  messagingSenderId: "243316014670",
  appId: "1:243316014670:web:0545ce0b0cb81f7af54d1f",
  measurementId: "G-8NDCKNGPB0"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function fmtMoney(n) {
  return '$' + (Number(n) || 0).toLocaleString('es-MX', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function fmtDate(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

// ===== Cronograma de elaboración (inicio / envasado / entrega) =====
const RECETAS = {
  'r-stout':              { nombre: 'Coffee Stout',                   tiempoTotalDias: 32 },
  'r-belgian':            { nombre: 'Belgian Blonde Albahaca-Romero', tiempoTotalDias: 24 },
  'r-honey-wheat':        { nombre: 'Honey Wheat',                    tiempoTotalDias: 24 },
  'r-dry-stout-bonafont': { nombre: 'Dry Stout',                      tiempoTotalDias: 24 },
  'r-coffee-stout-viking': { nombre: 'Coffee Stout Viking',           tiempoTotalDias: 30 },
};

function parseFecha(val) {
  if (!val) return null;
  if (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}/.test(val)) {
    const d = new Date(val.slice(0, 10) + 'T00:00:00');
    return isNaN(d.getTime()) ? null : d;
  }
  const d = new Date(val);
  return isNaN(d.getTime()) ? null : d;
}

function addDays(val, days) {
  const d = parseFecha(val);
  if (!d || days == null) return null;
  const out = new Date(d.getTime());
  out.setDate(out.getDate() + days);
  return out;
}

function fmtDateLarga(val) {
  const d = val instanceof Date ? val : parseFecha(val);
  if (!d || isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
}

function nombreRecetaLote(lote) {
  if (lote.recetaId && RECETAS[lote.recetaId]) return RECETAS[lote.recetaId].nombre;
  return lote.nombreReceta || lote.estilo || lote.nombre || 'Lote';
}

async function load() {
  try {
    const [snapEntregas, snapCliente, snapLotes] = await Promise.all([
      db.ref('bitacora/entregas').once('value'),
      db.ref('bitacora/entregas-cliente').once('value'),
      db.ref('bitacora/lotes-bitacora').once('value')
    ]);

    const entregas = snapEntregas.val() || [];
    const cliente = snapCliente.val() || 'Cliente';
    const lotesRaw = snapLotes.val() || [];
    const lotes = Array.isArray(lotesRaw) ? lotesRaw : Object.values(lotesRaw);

    render(cliente, Array.isArray(entregas) ? entregas : [], lotes.filter(Boolean));
  } catch (e) {
    console.error(e);
    document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="empty">No se pudo cargar la información.<br>Intenta de nuevo más tarde.</div>
      </div>`;
  }
}

let CLIENTE_CACHE = 'Cliente';
let ENTREGAS_CACHE = [];

// Para cada lote destinado a este cliente, intenta encontrar la entrega real
// ya registrada (mismo sabor, fecha igual o posterior al envasado) y que no
// haya sido usada ya por otro lote más antiguo — si no hay match, se estima.
function buscarEntregaReal(lote, entregas, usadas) {
  const nombre = nombreRecetaLote(lote);
  const desde = lote.fechaEmbotellado || lote.fecha;
  let mejor = null;
  entregas.forEach((e, i) => {
    if (usadas.has(i)) return;
    if ((e.sabor || '') !== nombre) return;
    if (desde && e.fecha && e.fecha < desde) return;
    if (!mejor || (e.fecha || '') < (entregas[mejor].fecha || '')) mejor = i;
  });
  if (mejor != null) { usadas.add(mejor); return entregas[mejor]; }
  return null;
}

function cronogramaHtml(lotes, entregas) {
  const relevantes = lotes.filter(l => l.botellasCliente !== undefined && l.botellasCliente !== null && l.botellasCliente !== '');
  if (relevantes.length === 0) return '';

  relevantes.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  const usadas = new Set();

  const items = relevantes.map(lote => {
    const receta = RECETAS[lote.recetaId];
    const nombre = nombreRecetaLote(lote);
    const inicio = lote.fecha;
    const envasado = lote.fechaEmbotellado || null;
    const entregaReal = buscarEntregaReal(lote, entregas, usadas);
    const entregaEstimada = !entregaReal && receta ? addDays(lote.fecha, receta.tiempoTotalDias) : null;

    return `
      <div class="pedido">
        <div class="pedido-top">
          <div class="sabor">${nombre}</div>
        </div>
        <div class="detalle">
          <div>Inicio: ${fmtDateLarga(inicio)}</div>
          <div>Envasado: ${envasado ? fmtDateLarga(envasado) : 'Pendiente'}</div>
          <div>Entrega: ${entregaReal ? fmtDateLarga(entregaReal.fecha) + ' (confirmada)' : (entregaEstimada ? fmtDateLarga(entregaEstimada) + ' (estimada)' : 'Por definir')}</div>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="card">
      <h2>Cronograma de elaboración</h2>
      <p class="muted" style="margin-bottom:10px;">Fechas de inicio, envasado y entrega de tus lotes. Las de envasado y entrega pueden ajustarse mientras el lote sigue en proceso.</p>
      ${items}
    </div>
  `;
}

function render(cliente, entregas, lotes) {
  CLIENTE_CACHE = cliente;
  ENTREGAS_CACHE = entregas;

  const totalBotellas = entregas.reduce((s, e) => s + (e.botellas || 0), 0);
  const pendientes = entregas.filter(e => !e.pagado);
  const totalPendiente = pendientes.reduce((s, e) => s + (e.precio || 0), 0);

  let pedidosHtml = '';
  if (entregas.length === 0) {
    pedidosHtml = `<div class="empty">Aún no hay pedidos registrados.</div>`;
  } else {
    pedidosHtml = entregas.map((e, idx) => `
      <div class="pedido">
        <div class="pedido-top">
          <div>
            <div class="sabor">${e.sabor || '—'}</div>
            <div class="fecha">${fmtDate(e.fecha)}</div>
          </div>
          <span class="estado ${e.pagado ? 'pagado' : 'pendiente'}">
            ${e.pagado ? 'Pagado' : 'Pendiente'}
          </span>
        </div>
        <div class="detalle">${e.botellas || 0} botellas · ${fmtMoney(e.precio || 0)}</div>
        <button class="btn-pdf" data-recibo="${idx}">Ver / imprimir recibo</button>
      </div>
    `).join('');
  }

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="cliente-name">${cliente}</div>
      <p class="muted">Aquí puedes consultar el estado de tus entregas.</p>
    </div>

    <div class="resumen">
      <div class="stat">
        <span class="num">${totalBotellas}</span>
        <span class="lbl">Botellas totales</span>
      </div>
      <div class="stat">
        <span class="num">${fmtMoney(totalPendiente)}</span>
        <span class="lbl">Pendiente de pago</span>
      </div>
    </div>

    <div class="card">
      <h2>Tus pedidos</h2>
      ${pedidosHtml}
    </div>

    ${cronogramaHtml(lotes, entregas)}
  `;

  document.querySelectorAll('[data-recibo]').forEach(btn => {
    btn.addEventListener('click', () => imprimirRecibo(Number(btn.dataset.recibo)));
  });
}

// Recibo idéntico (mismo HTML/CSS) al que genera imprimirRecibo() en index.html,
// para que el cliente vea y pueda imprimir/guardar como PDF el mismo formato
// de ticket que usa el panel al registrar una entrega.
function imprimirRecibo(idx) {
  const entrega = ENTREGAS_CACHE[idx];
  if (!entrega) return;

  const cliente = CLIENTE_CACHE || 'Cliente';
  const folio = 'R-' + (entrega.fecha || '').replace(/-/g, '') + '-' + String(Math.floor(Math.random() * 900) + 100);
  const estadoPago = entrega.pagado ? 'PAGADO' : 'PENDIENTE DE PAGO';
  const precioUnit = entrega.botellas > 0 ? (entrega.precio / entrega.botellas) : 0;

  const html = `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recibo ${folio}</title>
<style>
  @page { size: 80mm auto; margin: 8mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', Courier, monospace;
    font-size: 12px;
    color: #1a1a1a;
    padding: 12px;
    max-width: 320px;
    margin: 0 auto;
  }
  .center { text-align: center; }
  .right { text-align: right; }
  .bold { font-weight: bold; }
  h1 {
    font-size: 16px;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .sub { font-size: 11px; color: #444; margin-bottom: 10px; }
  hr {
    border: none;
    border-top: 1px dashed #333;
    margin: 10px 0;
  }
  .row {
    display: flex;
    justify-content: space-between;
    margin: 4px 0;
  }
  .label { color: #555; }
  .total {
    font-size: 15px;
    font-weight: bold;
    margin-top: 6px;
  }
  .estado {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 10px;
    border: 1.5px solid #333;
    font-size: 11px;
    letter-spacing: 1px;
  }
  .estado.pagado { background: #e8f5e9; }
  .estado.pendiente { background: #fff3e0; }
  .footer {
    margin-top: 14px;
    font-size: 10px;
    color: #666;
    text-align: center;
  }
  .actions {
    margin-top: 18px;
    text-align: center;
  }
  .actions button {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 18px;
    margin: 0 4px;
    cursor: pointer;
    border: 1px solid #333;
    background: #fff;
    border-radius: 4px;
  }
  .actions button.primary {
    background: #2a1d13;
    color: #fff;
  }
  @media print {
    .actions { display: none; }
    body { padding: 0; }
  }
</style>
</head>
<body>
  <div class="center">
    <h1>CERVECERÍA TIERRA GRANDE</h1>
    <div class="sub">nano brewery</div>
  </div>
  <hr>
  <div class="row"><span class="label">Folio</span><span>${folio}</span></div>
  <div class="row"><span class="label">Fecha</span><span>${entrega.fecha || '—'}</span></div>
  <div class="row"><span class="label">Cliente</span><span class="bold">${cliente}</span></div>
  <hr>
  <div class="row"><span class="label">Producto</span><span class="bold">${entrega.sabor || '—'}</span></div>
  <div class="row"><span class="label">Cantidad</span><span>${entrega.botellas || 0} botellas (355 ml)</span></div>
  <div class="row"><span class="label">Precio unitario</span><span>${fmtMoney(precioUnit)}</span></div>
  <hr>
  <div class="row total"><span>TOTAL</span><span>${fmtMoney(entrega.precio || 0)}</span></div>
  <div class="center">
    <span class="estado ${entrega.pagado ? 'pagado' : 'pendiente'}">${estadoPago}</span>
  </div>
  <hr>
  <div class="footer">
    Gracias por su preferencia<br>
    Cerveza artesanal · Lote pequeño
  </div>
  <div class="actions">
    <button class="primary" onclick="window.print()">Imprimir / Guardar PDF</button>
    <button onclick="window.close()">Cerrar</button>
  </div>
</body>
</html>`;

  const w = window.open('', '_blank', 'width=420,height=640');
  if (!w) {
    alert('Permite ventanas emergentes para ver el recibo.');
    return;
  }
  w.document.write(html);
  w.document.close();
}

load();
</script>
</body>
</html>
